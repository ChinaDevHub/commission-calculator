name: commission_calculator
description: "Calculates transaction commissions with weekly allowances and multi-currency rules."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2



  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  decimal: ^2.3.3
  either_dart: ^1.0.0
  get_it: ^9.3.0
  flutter_screenutil: ^5.9.3
  bloc: ^9.2.1
  shimmer: ^4.0.0
  lottie: ^3.6.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5


flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/font/
    - assets/icons/
    - assets/images/
    - assets/lang/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/font/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/font/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/font/Inter_18pt-Bold.ttf
          weight: 700